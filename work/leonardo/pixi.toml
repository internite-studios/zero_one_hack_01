# =============================================================================
# Zero One Hack_01 — pixi Project Manifest
# =============================================================================
# This defines a reproducible environment for training on Leonardo.
#
# Usage:
#   pixi install              # Install all dependencies
#   pixi shell -e gpu          # Enter GPU training environment
#   pixi run -e gpu train      # Run the training task
#   pixi run -e gpu evaluate   # Run evaluation
# =============================================================================

[project]
name = "zero-one-hack"
version = "0.1.0"
description = "Zero One Hack_01 — Leonardo training environment"
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

# =============================================================================
# System requirements for GPU nodes
# =============================================================================
[system-requirements]
cuda = "12.4"
libc = { family = "glibc", version = "2.28" }

# =============================================================================
# Base dependencies (both CPU dev and GPU training)
# =============================================================================
[dependencies]
python = "3.12.*"
pip = "*"

# =============================================================================
# CPU / Development feature
# =============================================================================
[feature.dev.dependencies]
ipython = "*"
jupyter = "*"
ruff = ">=0.6"
pytest = ">=8"

[feature.dev.pypi-dependencies]
# Add any PyPI-only dev tools here

# =============================================================================
# GPU / Training feature (used on Leonardo compute nodes)
# =============================================================================
[feature.gpu.dependencies]
pytorch = { version = ">=2.5,<3", channel = "pytorch" }
torchvision = { version = "*", channel = "pytorch" }
torchaudio = { version = "*", channel = "pytorch" }
pytorch-cuda = { version = "==12.4", channel = "pytorch" }

# HuggingFace ecosystem
transformers = { version = ">=4.45", channel = "conda-forge" }
datasets = { version = "*", channel = "conda-forge" }
accelerate = { version = "*", channel = "conda-forge" }
huggingface_hub = { version = "*", channel = "conda-forge" }

# Tokenizer backends (needed by various models)
sentencepiece = "*"
tiktoken = "*"

# Training utilities
tensorboard = "*"
numpy = "*"
pandas = "*"
scikit-learn = "*"
matplotlib = "*"

[feature.gpu.pypi-dependencies]
# Add PyPI-only packages here, e.g.:
# wandb = "*"
# einops = "*"

# =============================================================================
# Combined environments
# =============================================================================
[environments]
default = ["dev"]                         # For local dev / login node
gpu = ["dev", "gpu"]                      # For GPU compute nodes

# =============================================================================
# Tasks — use with: pixi run -e <env> <task>
# =============================================================================
[tasks]

# --- Training ---
train = { cmd = "python train.py", env = { WANDB_MODE = "offline" } }
train-distributed = { cmd = "python -u -m torch.distributed.run --nproc_per_node ${NPROC:-4} --nnodes ${NNODES:-1} train.py", env = { WANDB_MODE = "offline" } }

# --- Evaluation ---
evaluate = "python eval.py"
eval-baseline = "python eval.py --mode baseline"
eval-trained = "python eval.py --mode trained"

# --- LLM Inference ---
download-model = "python work/leonardo/download_model.py"
infer = "python work/leonardo/inference.py"
infer-custom = "python work/leonardo/inference.py --prompt"

# --- Utilities ---
lint = "ruff check ."
format = "ruff format ."
shell = "python -c 'import torch; print(f\"PyTorch {torch.__version__}\"); print(f\"CUDA available: {torch.cuda.is_available()}\"); print(f\"GPU: {torch.cuda.get_device_name(0) if torch.cuda.is_available() else \"N/A\"}\")'"
